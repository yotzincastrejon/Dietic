name: DieticPreview
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  DieticPreview:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../Shared/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.yotzin.Dietic.DesignPreview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dietic Preview
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  DieticJournal:
    type: application
    platform: iOS
    sources:
      - Journal
      - Sources/DiaryData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.yotzin.Dietic.JournalPreview
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Dietic Journal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  DieticOrbit:
    type: application
    platform: iOS
    sources:
      - Orbit
      - Sources/DiaryData.swift
      - Journal/JournalInk.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.yotzin.Dietic.OrbitPreview
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Dietic Orbit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  DieticCoconut:
    type: application
    platform: iOS
    sources:
      - Coconut
      - Sources/DiaryData.swift
      - Journal/JournalLogger.swift
      - Journal/JournalInk.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.yotzin.Dietic.CoconutPreview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dietic Coconut
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  DieticCoconutTable:
    type: application
    platform: iOS
    sources:
      - CoconutTable
      - Coconut/CoconutStyle.swift
      - Sources/DiaryData.swift
      - Journal/JournalLogger.swift
      - Journal/JournalInk.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.yotzin.Dietic.CoconutTablePreview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coconut Table
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  DieticMarket:
    type: application
    platform: iOS
    sources:
      - Market
      - Sources/DiaryData.swift
      - Journal/JournalLogger.swift
      - Journal/JournalInk.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.yotzin.Dietic.MarketPreview
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Dietic Market
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  DieticNourish:
    type: application
    platform: iOS
    sources:
      - Nourish
      - Sources/DiaryData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.yotzin.Dietic.NourishPreview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dietic Nourish
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  DieticNourish:
    build:
      targets:
        DieticNourish: all
  DieticMarket:
    build:
      targets:
        DieticMarket: all
  DieticCoconutTable:
    build:
      targets:
        DieticCoconutTable: all
  DieticCoconut:
    build:
      targets:
        DieticCoconut: all
  DieticOrbit:
    build:
      targets:
        DieticOrbit: all
  DieticJournal:
    build:
      targets:
        DieticJournal: all
  DieticPreview:
    build:
      targets:
        DieticPreview: all
